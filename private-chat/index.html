<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>私密聊天室</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#171b2e;
    --bubble:#222845;
    --mine:#2f6df6;
    --text:#e8ecf6;
    --muted:#8a93ad;
    --accent:#5b8cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#1c2545 0%,var(--bg) 55%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .app{
    width:100%;max-width:720px;height:min(90vh,760px);
    background:var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);
    display:flex;align-items:center;gap:12px;
  }
  .lock{
    width:38px;height:38px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#2f6df6,#7b5bff);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .title{font-weight:600;font-size:16px;line-height:1.2;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .me{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .me-label{font-size:11px;}
  #nick{
    width:110px;background:var(--bubble);border:1px solid rgba(255,255,255,.08);
    color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;text-align:center;outline:none;
  }
  #nick:focus{border-color:var(--accent);}
  #clearbtn{
    margin-left:auto;flex:none;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--text);
    border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;
  }
  #clearbtn:active{transform:scale(.96);}

  .status{padding:6px 18px;font-size:12px;color:var(--muted);text-align:center;}

  .body{flex:1;display:flex;min-height:0;}
  #messages{
    flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;
    scrollbar-width:thin;
  }
  #messages::-webkit-scrollbar{width:6px;}
  #messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px;}

  .members{
    width:150px;flex:none;border-left:1px solid rgba(255,255,255,.06);
    padding:12px 10px;overflow-y:auto;background:rgba(255,255,255,.02);
  }
  .members-title{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:600;}
  #memlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  #memlist li{
    font-size:13px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.04);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #memlist li.me-item{background:rgba(91,140,255,.18);color:#cfe0ff;}

  .row{display:flex;flex-direction:column;max-width:82%;}
  .row.mine{align-self:flex-end;align-items:flex-end;}
  .name{font-size:11px;color:var(--muted);margin:0 6px 4px;}
  .bubble{
    position:relative;padding:10px 13px;border-radius:14px;line-height:1.45;
    font-size:15px;word-break:break-word;white-space:pre-wrap;
    background:var(--bubble);animation:pop .25s ease;
  }
  .row.mine .bubble{background:var(--mine);color:#fff;}
  .row.mine .name{text-align:right;}
  .sys{
    align-self:center;font-size:12px;color:var(--muted);
    background:rgba(255,255,255,.05);padding:4px 12px;border-radius:999px;
    animation:pop .25s ease;max-width:90%;text-align:center;
  }
  .bar{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:rgba(255,255,255,.35);border-radius:0 0 14px 14px;
    transform-origin:left;animation:shrink 20s linear forwards;
    animation-play-state:paused;
  }
  .row.unread .bar{background:rgba(255,255,255,.16);}
  .row.unread .name::after{content:' ·未读';color:#f0b400;}
  @keyframes shrink{from{transform:scaleX(1);}to{transform:scaleX(0);}}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .fade{opacity:0;transition:opacity .5s ease;}

  footer{padding:12px;border-top:1px solid rgba(255,255,255,.06);}
  .hint{font-size:11px;color:var(--muted);margin:0 2px 8px;word-break:break-all;}
  .hint b{color:var(--accent);}
  .linkrow{display:inline-flex;align-items:center;gap:8px;margin-top:4px;}
  #copybtn{
    border:1px solid rgba(91,140,255,.5);background:rgba(91,140,255,.12);color:#cfe0ff;
    border-radius:8px;padding:3px 10px;font-size:11px;cursor:pointer;flex:none;
  }
  #copybtn:active{transform:scale(.96);}
  .inputbar{display:flex;gap:8px;}
  #input{
    flex:1;background:var(--bubble);border:1px solid rgba(255,255,255,.08);
    color:var(--text);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;
  }
  #input:focus{border-color:var(--accent);}
  #ttl{
    width:auto;flex:none;background:var(--bubble);border:1px solid rgba(255,255,255,.08);
    color:#fff;border-radius:12px;padding:0 6px;font-size:13px;outline:none;cursor:pointer;
  }
  #ttl:focus{border-color:var(--accent);}
  .bubble .perm{font-size:10px;color:rgba(255,255,255,.45);margin-top:5px;letter-spacing:.5px;}
  #send{
    border:none;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,#2f6df6,#7b5bff);cursor:pointer;
  }
  #send:active{transform:scale(.97);}

  @media (max-width:560px){
    .members{width:108px;}
    .app{max-width:100%;}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="lock">🔒</div>
      <div>
        <div class="title">私密聊天室</div>
        <div class="sub">阅后即焚 · 销毁时长由发送者设定</div>
      </div>
      <button id="clearbtn" type="button" title="清空自己屏幕上的消息（不影响他人）">清屏</button>
      <div class="me">
        <span class="me-label">你的昵称（可改）</span>
        <input id="nick" maxlength="12" placeholder="点此设置">
      </div>
    </header>

    <div class="status" id="status">正在连接…</div>

    <div class="body">
      <div id="messages"></div>
      <aside class="members">
        <div class="members-title">成员 <span id="memcount">0</span></div>
        <ul id="memlist"></ul>
      </aside>
    </div>

    <footer>
      <div class="hint">分享链接（发给朋友即可加入）：<br>
        <span class="linkrow"><b id="sharelink">连接中…</b><button id="copybtn" type="button">复制</button></span>
      </div>
      <div class="inputbar">
        <select id="ttl" title="消息销毁时间">
          <option value="3000">3 秒</option>
          <option value="10000">10 秒</option>
          <option value="20000" selected>20 秒</option>
          <option value="60000">60 秒</option>
          <option value="300000">5 分钟</option>
          <option value="0">永久</option>
        </select>
        <input id="input" type="text" maxlength="500" placeholder="说点什么…（回车发送）" autocomplete="off">
        <button id="send">发送</button>
      </div>
    </footer>
  </div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const status = document.getElementById('status');
  const nick = document.getElementById('nick');
  const sharelinkEl = document.getElementById('sharelink');
  const memlist = document.getElementById('memlist');
  const memcount = document.getElementById('memcount');
  const copyBtn = document.getElementById('copybtn');
  const ttlSel = document.getElementById('ttl');
  const clearBtn = document.getElementById('clearbtn');

  let myId = '';
  let myName = '';
  let ws = null;
  let connected = false;
  let lastGoodHost = null;
  let lanLink = '';

  function isLocalHost(host) {
    return /^(localhost|127\.|0\.0\.0\.0|\[::1\]|::1)/.test(host || '');
  }

  function updateShareLink() {
    let link;
    if (lastGoodHost && !isLocalHost(lastGoodHost)) {
      // 隧道 / 公网地址：直接可外网分享
      link = (location.protocol === 'https:' ? 'https' : 'http') + '://' + lastGoodHost + '/';
    } else {
      // 本地访问：优先用局域网 IP，供同 WiFi 分享
      link = lanLink || ((location.protocol === 'https:' ? 'https' : 'http') + '://' + (lastGoodHost || 'localhost:3000') + '/');
    }
    sharelinkEl.textContent = link;
    sharelinkEl.dataset.link = link;
  }

  function candidateHosts() {
    const list = [];
    if (lastGoodHost) list.push(lastGoodHost);
    if (location.host) list.push(location.host);
    ['localhost:3000', '127.0.0.1:3000'].forEach(h => { if (!list.includes(h)) list.push(h); });
    return list;
  }

  function connect() {
    const hosts = candidateHosts();
    let i = 0;
    status.textContent = '正在连接…';
    function tryOne() {
      if (i >= hosts.length) {
        status.textContent = '无法连接，请确认服务已启动 (node server.js)';
        setTimeout(connect, 3000);
        return;
      }
      const host = hosts[i];
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + host);
      let opened = false;
      ws.onopen = () => {
        opened = true; connected = true; lastGoodHost = host; status.textContent = '已连接';
        updateShareLink();
      };
      ws.onmessage = onMessage;
      ws.onerror = () => { if (!opened) { i++; tryOne(); } };
      ws.onclose = () => {
        if (opened) {
          connected = false;
          status.textContent = '连接断开，3 秒后重连…';
          setTimeout(connect, 3000);
        } else { i++; tryOne(); }
      };
    }
    tryOne();
  }

  function onMessage(e) {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === 'welcome') {
      myId = msg.id;
      myName = msg.name;
      nick.value = myName;
      if (msg.lan) lanLink = msg.lan;
      updateShareLink();
      addSystem('👋 你已进入私密聊天室，消息阅后即焚（销毁时长由发送者设定）');
      if (msg.members) renderMembers(msg.members);
    } else if (msg.type === 'members') {
      renderMembers(msg.list);
    } else if (msg.type === 'system') {
      addSystem(msg.text);
    } else if (msg.type === 'chat') {
      addMessage(msg);
    }
  }

  function renderMembers(list) {
    memcount.textContent = list.length;
    memlist.innerHTML = '';
    for (const m of list) {
      const li = document.createElement('li');
      li.textContent = m.name + (m.id === myId ? '（我）' : '');
      if (m.id === myId) {
        li.className = 'me-item';
        if (document.activeElement !== nick) { myName = m.name; nick.value = m.name; }
      }
      memlist.appendChild(li);
    }
  }

  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    messages.appendChild(el);
    scheduleRemove(el, 20000);
    scroll();
  }

  const pending = new Set();
  // 用聊天滚动容器作为 root，精确判断消息是否真正出现在可视区域
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const m = entry.target.__msg;
      if (m) m.intersecting = entry.isIntersecting;
      if (entry.isIntersecting) tryMarkSeen(m);
    }
  }, { root: messages, threshold: 0 });

  // 读到消息后才启动「按发送者设定时长」的销毁倒计时
  function startDestroy(m) {
    const ttl = m.ttl; // 0 = 永久
    m.seen = true;
    if (!m.mine) m.nameEl.textContent = m.nameText;
    m.el.classList.remove('unread');
    if (ttl > 0 && m.bar) {
      m.bar.style.animationDuration = (ttl / 1000) + 's';
      m.bar.style.animationPlayState = 'running';
      setTimeout(() => m.el.classList.add('fade'), ttl - 600);
      setTimeout(() => { if (m.el.parentNode) m.el.parentNode.removeChild(m.el); }, ttl);
    }
  }

  function tryMarkSeen(m) {
    if (!m || m.seen) return;
    if (document.visibilityState !== 'visible') return; // 页面必须在前台
    if (!m.intersecting) return;                         // 消息必须在可视区
    pending.delete(m);
    observer.unobserve(m.el);
    startDestroy(m);
  }

  function addMessage(msg) {
    const mine = msg.id === myId;
    const ttl = (typeof msg.ttl === 'number') ? msg.ttl : 20000; // 缺省 20 秒；0 = 永久
    const row = document.createElement('div');
    row.className = 'row' + (mine ? ' mine' : (ttl > 0 ? ' unread' : ''));

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = mine ? '我' : msg.name;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.text;
    let bar = null;
    if (ttl > 0) {
      bar = document.createElement('div');
      bar.className = 'bar';
      bubble.appendChild(bar);
    } else {
      const perm = document.createElement('div');
      perm.className = 'perm';
      perm.textContent = '∞ 永久';
      bubble.appendChild(perm);
    }

    row.appendChild(name);
    row.appendChild(bubble);
    messages.appendChild(row);

    const m = { el: row, bar, nameEl: name, nameText: msg.name, mine, seen: false, intersecting: false, ttl };
    row.__msg = m;

    if (mine) {
      startDestroy(m);   // 自己发的：已读，立即开始倒计时
    } else if (ttl > 0) {
      pending.add(m);
      observer.observe(row);
      tryMarkSeen(m);    // 若在可视区且页面可见，立即开始
    }
    scroll();
  }

  // 从别的页面切回来时，重新检查未读消息是否已进入可视区
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      for (const m of pending) tryMarkSeen(m);
    }
  });

  function scheduleRemove(el, ms) {
    setTimeout(() => el.classList.add('fade'), ms - 600);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, ms);
  }

  function scroll() {
    messages.scrollTop = messages.scrollHeight;
  }

  function clearScreen() {
    for (const m of pending) { observer.unobserve(m.el); }
    pending.clear();
    messages.innerHTML = '';
    addSystem('🧹 屏幕已清空（仅你本地，不影响他人）');
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    const ttl = parseInt(ttlSel.value, 10) || 0;
    ws.send(JSON.stringify({ type: 'chat', text, ttl }));
    input.value = '';
  }

  function rename() {
    const name = nick.value.trim().slice(0, 12);
    if (!name || name === myName || !ws || ws.readyState !== 1) { nick.value = myName; return; }
    ws.send(JSON.stringify({ type: 'rename', name }));
    myName = name;
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  nick.addEventListener('change', rename);
  nick.addEventListener('keydown', (e) => { if (e.key === 'Enter') nick.blur(); });
  clearBtn.addEventListener('click', clearScreen);

  copyBtn.addEventListener('click', async () => {
    const link = sharelinkEl.dataset.link || sharelinkEl.textContent;
    if (!link || link === '连接中…') return;
    let ok = false;
    try {
      await navigator.clipboard.writeText(link);
      ok = true;
    } catch {
      try {
        const ta = document.createElement('textarea');
        ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        ok = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch { ok = false; }
    }
    copyBtn.textContent = ok ? '已复制 ✓' : '复制失败';
    setTimeout(() => { copyBtn.textContent = '复制'; }, 1500);
  });

  connect();
</script>
</body>
</html>
